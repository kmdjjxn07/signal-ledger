# 운영 예시: 웹 + 예약 작업 실행기 + PostgreSQL. 실제 배포 전 비밀번호를 바꾸고 HTTPS 프록시 뒤에 두세요.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signal_ledger
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: change-me
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  migrate:
    build: .
    env_file: .env
    environment:
      SL_DATABASE_URL: postgresql+psycopg://signal:change-me@db:5432/signal_ledger
    command: ["python", "-m", "app.cli", "init-db"]
    depends_on: [db]
  web:
    build: .
    env_file: .env
    environment:
      SL_ENV: production
      SL_COOKIE_SECURE: "true"
      SL_DATABASE_URL: postgresql+psycopg://signal:change-me@db:5432/signal_ledger
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [migrate]
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      SL_ENV: production
      SL_DATABASE_URL: postgresql+psycopg://signal:change-me@db:5432/signal_ledger
    command: ["python", "-m", "app.worker"]
    depends_on: [migrate]
    restart: unless-stopped
volumes:
  pgdata:
